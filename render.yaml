services:
  - type: web
    name: brics-pulsegov-dpi
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: PORT
        value: 10000
